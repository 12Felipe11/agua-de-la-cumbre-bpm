<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agua de la Cumbre</title><link rel="stylesheet" th:href="@{/app.css(v='20261113c')}"></head><body class="login-screen"><div class="login-intro"><img class="login-logo" th:src="@{/brand/agua-de-la-cumbre.png}" alt="Agua de la Cumbre — Perfección de Alta Pureza" width="1254" height="1254"><h2>Tu operación,<br>en un solo lugar.</h2><p>Distribución, equipos de campo y cartera.<br>Un espacio para dar continuidad a cada proceso.</p></div><main class="login panel"><h1>Agua de la Cumbre</h1><p>Ingresa con tu cuenta para continuar.</p><p class="error" role="alert" th:if="${param.error}">Usuario o contraseña incorrectos.</p><form th:action="@{/login}" method="post"><label>Usuario<input name="username" required autocomplete="username"></label><label>Contraseña<input name="password" type="password" required autocomplete="current-password"></label><button>Ingresar</button></form></main></body></html>
