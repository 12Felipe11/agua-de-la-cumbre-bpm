<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear cuenta · Agua de la Cumbre</title><link rel="stylesheet" th:href="@{/app.css(v='20261113c')}"></head><body class="login-screen"><div class="login-intro"><img class="login-logo" th:src="@{/brand/agua-de-la-cumbre.png}" alt="Agua de la Cumbre" width="1254" height="1254"><h2>Solicitudes en un solo lugar.</h2><p>Crea tu cuenta para solicitar productos y equipos y consultar el estado de tus casos.</p></div><main class="login panel"><h1>Crear cuenta de cliente</h1><p class="error" role="alert" th:if="${error}" th:text="${error}"></p><form th:action="@{/registro}" method="post"><label for="nombre">Nombre</label><input id="nombre" name="nombre" required maxlength="100" autocomplete="name"><label for="usuario">Usuario</label><input id="usuario" name="usuario" required minlength="4" maxlength="40" pattern="[a-z0-9._-]+" autocomplete="username" autocapitalize="none" spellcheck="false"><label for="clave">Contraseña</label><p id="clave-ayuda">Al menos 8 caracteres.</p><input id="clave" name="clave" type="password" required minlength="8" maxlength="100" autocomplete="new-password" aria-describedby="clave-ayuda"><button type="submit">Crear cuenta</button></form><p><a th:href="@{/login}">Ya tengo cuenta</a></p></main></body></html>
