<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${titulo}"></title><link rel="stylesheet" th:href="@{/app.css(v='20261113c')}"></head><body><main class="page form-page"><header class="page-heading"><a class="page-brand" th:href="@{/portal}" aria-label="Agua de la Cumbre: volver al portal"><img th:src="@{/brand/agua-de-la-cumbre.png}" alt="Agua de la Cumbre" width="1254" height="1254"></a><a th:href="@{/portal}">← Volver al portal</a><h1 th:text="${titulo}"></h1><p>Completa la información para continuar con el proceso.</p></header><p class="error" role="alert" th:if="${error}" th:text="${error}"></p><form class="panel form-grid" th:action="${action}" method="post"><div th:each="c : ${campos}" class="campo" th:classappend="${c.tipo == 'checkbox' ? 'wide check' : (c.tipo == 'textarea' ? 'wide' : '')}"><label th:for="${c.key}" th:text="${c.label}"></label><div th:switch="${c.tipo}"><textarea th:case="'textarea'" th:id="${c.key}" th:name="${c.key}" th:required="${c.requerido}" th:disabled="${c.lectura}" th:text="${valores[c.key]}"></textarea><select th:case="'select'" th:id="${c.key}" th:name="${c.key}" th:required="${c.requerido}" th:disabled="${c.lectura}"><option value="">Seleccione</option><option th:each="o : ${c.opciones}" th:value="${o}" th:text="${o}" th:selected="${o == valores[c.key]}"></option></select><input th:case="'checkbox'" type="checkbox" th:id="${c.key}" th:name="${c.key}" value="true" th:checked="${valores[c.key] != null and valores[c.key].toString() == 'true'}" th:disabled="${c.lectura}"><input th:case="*" th:type="${c.tipo == 'number' ? 'number' : 'text'}" th:id="${c.key}" th:name="${c.key}" th:value="${valores[c.key]}" th:required="${c.requerido}" th:disabled="${c.lectura}" th:attr="min=${c.tipo == 'number' and !c.lectura ? 1 : null},step=${c.tipo == 'number' ? 1 : null}" maxlength="200"></div></div><div class="form-actions"><a class="button secondary" th:href="@{/portal}">Volver al panel</a><button>Guardar y continuar</button></div></form></main></body></html>
